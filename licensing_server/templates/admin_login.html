<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Login — YouTube Assistant</title>
<style>
  body { background:#0c0b16; color:#f1efff; font-family:system-ui,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  form { background:#15142c; border:1px solid #2c2947; border-radius:14px; padding:32px; width:280px; }
  h1 { font-size:18px; margin:0 0 20px; }
  input { width:100%; padding:10px; border-radius:8px; border:1px solid #2c2947; background:#1c1a2e; color:#fff; margin-bottom:14px; box-sizing:border-box; }
  button { width:100%; padding:10px; border:none; border-radius:8px; background:linear-gradient(135deg,#5b6ee8,#8347d9); color:#fff; font-weight:600; cursor:pointer; }
  .error { color:#ff5d5d; font-size:13px; margin-bottom:12px; }
</style>
</head>
<body>
  <form method="post">
    <h1>🔒 Admin Login</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
